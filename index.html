<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Radio</title>
</head>
<body style="margin:0">
<div id="player"></div>
<script>
// Hidden YouTube player of the in-game phone radio.
// Opened as ?v=<video id>&volume=<0-100>, reports to Lua through the
// "radio" object the game injects (absent in a normal browser).
var params = new URLSearchParams(location.search);
var videoId = params.get("v") || "";
var volume = parseInt(params.get("volume"), 10);
if (isNaN(volume)) volume = 50;
volume = Math.min(100, Math.max(0, volume));
var player;
var reported = false;

function send(name, a, b) {
	if (window.radio && radio[name]) radio[name](a, b);
}

// Reports the playback time every second. A hidden player does not
// always fire the playing state change, the moving time is the
// reliable sign.
function watchPlayback() {
	setInterval(function() {
		if (!player.getCurrentTime) return;
		var time = player.getCurrentTime();
		send("OnTime", time, player.getDuration());
		if (reported || time <= 0) return;
		reported = true;
		send("OnPlaying");
	}, 1000);
}

function setVolume(i) {
	if (player && player.setVolume) player.setVolume(i);
}

function seekTo(time) {
	if (player && player.seekTo) player.seekTo(time, true);
}

function pauseVideo() {
	if (player && player.pauseVideo) player.pauseVideo();
}

function playVideo() {
	if (player && player.playVideo) player.playVideo();
}

function onYouTubeIframeAPIReady() {
	if (!/^[\w-]{11}$/.test(videoId)) {
		send("OnError", 2);
		return;
	}
	player = new YT.Player("player", {
		width: 200,
		height: 200,
		videoId: videoId,
		playerVars: { autoplay: 1, controls: 0, playsinline: 1 },
		events: {
			onReady: function(e) {
				e.target.unMute();
				e.target.setVolume(volume);
				e.target.playVideo();
				watchPlayback();
			},
			onStateChange: function(e) {
				if (e.data === 1) e.target.unMute();
				if (e.data === 1) send("OnPlaying");
				if (e.data === 2) send("OnPaused");
				if (e.data === 0) send("OnEnded");
			},
			onError: function(e) { send("OnError", e.data); }
		}
	});
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
